<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Save Research</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container">
    <h3>Save Research Entry</h3>
    <hr>

    <form th:object="${research}" th:action="@{/admin/research/save}" method="POST">
        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label for="type" class="form-label">Type</label>
            <select id="type" th:field="*{type}" class="form-select" required>
                <option value="">Select type</option>
                <option value="Patent">Patent</option>
                <option value="Publication">Publication</option>
            </select>
        </div>

        <div class="mb-3">
            <label for="title" class="form-label">Title</label>
            <input type="text" id="title" th:field="*{title}" class="form-control" placeholder="Title" required>
        </div>

        <div class="mb-3">
            <label for="authors" class="form-label">Authors / Inventors</label>
            <input type="text" id="authors" th:field="*{authors}" class="form-control" placeholder="Comma-separated names">
        </div>

        <div class="mb-3">
            <label for="venue" class="form-label">Venue / Assignee</label>
            <input type="text" id="venue" th:field="*{venue}" class="form-control"
                   placeholder="Journal, conference, or patent assignee">
        </div>

        <div class="mb-3">
            <label for="referenceNumber" class="form-label">Reference Number</label>
            <input type="text" id="referenceNumber" th:field="*{referenceNumber}" class="form-control"
                   placeholder="Patent number or DOI">
        </div>

        <div class="mb-3">
            <label for="status" class="form-label">Status</label>
            <select id="status" th:field="*{status}" class="form-select">
                <option value="">Select status</option>
                <option value="Granted">Granted</option>
                <option value="Pending">Pending</option>
                <option value="Published">Published</option>
                <option value="In Review">In Review</option>
            </select>
        </div>

        <div class="mb-3">
            <label for="publishedDate" class="form-label">Published / Issue Date</label>
            <input type="date" id="publishedDate" th:field="*{publishedDate}" class="form-control">
        </div>

        <div class="mb-3">
            <label for="link" class="form-label">Link</label>
            <input type="url" id="link" th:field="*{link}" class="form-control"
                   placeholder="Google Patents, DOI, or publisher URL">
        </div>

        <div class="mb-3">
            <label for="description" class="form-label">Summary</label>
            <textarea id="description" th:field="*{description}" class="form-control" rows="4"
                      placeholder="Brief summary or abstract"></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Save</button>
    </form>

    <hr>
    <div class="d-flex">
        <a th:href="@{/admin/research}" class="me-3">Back to Research List</a>
        <a th:href="@{/admin}" class="me-3">Back to Admin Home</a>
        <a th:href="@{/}">Back to Portfolio</a>
    </div>
</div>

</body>
</html>
