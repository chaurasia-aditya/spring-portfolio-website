<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Research Directory</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container">
    <h3>Research Directory</h3>
    <hr>

    <a th:href="@{/admin/research/showFormForAdd}" class="btn btn-primary btn-sm mb-3">
        Add new entry
    </a>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>Type</th>
            <th>Title</th>
            <th>Authors</th>
            <th>Venue</th>
            <th>Reference</th>
            <th>Status</th>
            <th>Published</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="entry : ${researchEntries}">
            <td th:text="${entry.type}"></td>
            <td th:text="${entry.title}"></td>
            <td th:text="${entry.authors}"></td>
            <td th:text="${entry.venue}"></td>
            <td th:text="${entry.referenceNumber}"></td>
            <td th:text="${entry.status}"></td>
            <td th:text="${entry.publishedDate != null ? #temporals.format(entry.publishedDate, 'yyyy-MM-dd') : ''}"></td>
            <td>
                <a th:href="@{/admin/research/showFormForUpdate(researchId=${entry.id})}" class="btn btn-info btn-sm">Update</a>
                <a th:href="@{/admin/research/delete(researchId=${entry.id})}" class="btn btn-danger btn-sm"
                   onclick="if (!(confirm('Are you sure you want to delete this research entry?'))) return false">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>

    <div class="d-flex">
        <a th:href="@{/admin}" class="me-3">Back to Admin Home</a>
        <a th:href="@{/}">Back to Portfolio</a>
    </div>
</div>

</body>
</html>
