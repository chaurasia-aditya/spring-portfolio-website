spring.application.name=portfolio

# In-memory H2 database (MySQL compatibility mode)
spring.datasource.url=jdbc:h2:mem:portfolio_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.defer-datasource-initialization=true

spring.thymeleaf.cache=true

logging.level.org.springframework.security=WARN

skill.categories=Languages,Frameworks/Libraries,DevOps/Tools,Domains

# Disable rate limiting for most integration tests (see RateLimitFilterTest)
app.rate-limit.enabled=false
